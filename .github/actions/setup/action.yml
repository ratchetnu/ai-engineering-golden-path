name: Set up project
description: Install the pinned Node.js version and the exact dependency tree from package-lock.json.
runs:
  using: composite
  steps:
    - name: Set up Node.js (version from .nvmrc)
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Install exact dependencies (npm ci)
      shell: bash
      run: npm ci --no-audit --no-fund
